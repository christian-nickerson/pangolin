[project]
name = "pangolin"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dynconf>=0.4",
    "grpc-interceptor>=0.15.4",
    "grpcio>=1.74.0",
    "grpcio-health-checking>=1.74.0",
]

[dependency-groups]
dev = [
    "black>=25.1.0",
    "grpc-stubs>=1.53.0.6",
    "grpcio-tools>=1.74.0",
    "mypy>=1.17.1",
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "ruff>=0.12.10",
    "types-protobuf>=6.30.2.20250822",
]

embedding-server = [
   "sentence-transformers>=5.1.0",
]

[tool.black]
line-length = 119

[tool.ruff]
line-length = 119 # Django convention
indent-width = 4

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["E501", "F541", "B028"]
unfixable = ["B"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401"]
"models/src/proto/*" = ["B028", "F541"]
"**/{tests,docs,tools}/*" = ["E402"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
mypy_path = ["models/src", "models/tests"]
strict_optional = true

[tool.pytest.ini_options]
testpaths = ["models/tests"]
addopts = ["--cov", "--verbose"]
norecursedirs = ["dist", "build"]
pythonpath = ["models/src/"]
